name: daybook
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: daybook
      MYSQL_USER: daybook
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Run npm run setup first}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Run npm run setup first}
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "127.0.0.1:3306:3306"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent",
        ]
      interval: 5s
      timeout: 5s
      retries: 40
    restart: unless-stopped
  mongo:
    image: mongo:8.0
    volumes:
      - mongo-data:/data/db
    ports:
      - "127.0.0.1:27018:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"
    restart: unless-stopped
  migrate:
    build: .
    command: ["npm", "run", "db:init", "-w", "backend"]
    environment: &server-env
      MYSQL_DATABASE_URL: mysql://daybook:${MYSQL_PASSWORD}@mysql:3306/daybook
      MONGODB_URI: mongodb://mongo:27017/daybook
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Run npm run setup first}
      APP_URL: ${APP_URL:-http://localhost:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SMTP_HOST: ${DOCKER_SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-Daybook <no-reply@daybook.local>}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5-mini}
    depends_on:
      mysql:
        condition: service_healthy
      mongo:
        condition: service_healthy
  api:
    build: .
    environment: *server-env
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 10s
      retries: 15
    restart: unless-stopped
  worker:
    build: .
    command: ["npm", "run", "worker", "-w", "backend"]
    environment: *server-env
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
volumes:
  mysql-data:
  mongo-data:
